<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form / One-shader photo studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d6cfc4;color:#272921;font:14px/1.5 system-ui,sans-serif}canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}header{position:absolute;top:32px;left:38px;pointer-events:none}h1{font-size:28px;letter-spacing:-1.4px;margin:0;font-weight:600}h1 span{font-weight:300;color:#62665c}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;margin:7px 0;color:#555c50}.panel{position:absolute;right:32px;top:50%;transform:translateY(-50%);width:260px;background:rgba(249,248,242,.92);border:1px solid #ffffff95;border-radius:5px;padding:25px;box-shadow:0 16px 50px #30352512}h2{font-size:16px;font-weight:500;margin:0 0 3px}.muted{color:#74786e;font-size:12px;margin:0}section{border-top:1px solid #dcded3;margin-top:23px;padding-top:20px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}label{font-size:12px}output{font-variant-numeric:tabular-nums;font-size:11px;color:#6a705f}input[type=range]{width:100%;accent-color:#536a3d;margin:13px 0 20px;cursor:pointer;height:4px}input[type=checkbox]{accent-color:#536a3d;width:15px;height:15px;margin:0;cursor:pointer}.switch{margin-top:14px}button{width:100%;border:1px solid #cbd0c0;background:#edf0e5;color:#38472b;border-radius:3px;text-align:left;padding:11px 12px;margin-top:13px;cursor:pointer;font:inherit;font-size:12px}button:hover{background:#dfe6d3}button span{float:right}footer{position:absolute;bottom:26px;left:38px;right:32px;display:flex;justify-content:space-between;pointer-events:none;color:#525a4b;font-size:11px}.dot{display:inline-block;width:6px;height:6px;background:#617947;border-radius:50%;margin-right:7px}.error{position:absolute;left:10%;top:38%;width:55%;background:#fff3dc;padding:22px;border:1px solid #9e632c;white-space:pre-wrap}.error[hidden]{display:none}button:focus-visible,input:focus-visible{outline:2px solid #425c2a;outline-offset:5px}@media(max-width:650px){header{left:20px;top:18px}h1{font-size:24px}.panel{top:auto;bottom:48px;right:16px;left:16px;width:auto;transform:none;padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.panel>div{grid-column:1/-1}.panel section{margin-top:10px;padding-top:10px}.panel section:last-child{grid-column:2;grid-row:2}.panel section:nth-child(3){grid-column:1;grid-row:3;margin-top:0;border:0;padding-top:0}input[type=range]{margin-bottom:10px}footer{left:20px;right:20px;bottom:17px}footer .technical{display:none}}
</style>
</head>
<body>
<canvas id="studio" aria-label="Interactive raymarched product studio. Drag to orbit the camera."></canvas>
<header><h1>form <span>/ studio</span></h1><p class="eyebrow">One shader. An entire studio.</p></header>
<aside class="panel" aria-label="Studio controls"><div><h2>The light makes the form.</h2><p class="muted">A little space to experiment.</p></div>
<section><div class="row"><label for="light-azimuth">Key light · azimuth</label><output id="azimuth-value">−45°</output></div><input id="light-azimuth" type="range" min="-180" max="180" value="-45"><div class="row"><label for="light-height">Light height</label><output id="height-value">4.5</output></div><input id="light-height" type="range" min="1" max="8" step="0.1" value="4.5"></section>
<section><div class="row"><label>Object</label><output id="shape-count">01 / 03</output></div><button id="cycle-shape" type="button">Torus <span>↗</span></button></section>
<section><p class="muted">Isolate the ingredients</p><label class="row switch" for="toggle-reflections">Floor reflections<input type="checkbox" id="toggle-reflections" checked></label><label class="row switch" for="toggle-shadows">Soft shadows<input type="checkbox" id="toggle-shadows" checked></label></section>
</aside>
<footer><span><span class="dot"></span>Drag the scene to orbit</span><span class="technical">SDF geometry &nbsp; / &nbsp; Single pass &nbsp; / &nbsp; No textures</span></footer>
<div id="render-error" class="error" role="alert" hidden></div>
<script>
'use strict';
(()=>{
const canvas=document.getElementById('studio');
const errorBox=document.getElementById('render-error');
function fail(message){errorBox.textContent=message;errorBox.hidden=false;throw new Error(message)}
const gl=canvas.getContext('webgl2',{alpha:false,antialias:false,preserveDrawingBuffer:true});
if(!gl){fail('WebGL2 is unavailable. Enable hardware acceleration or open this studio in a WebGL2-capable browser.');return}
const vertex=`#version 300 es
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.-1.,0.,1.);}`;
const fragment=`#version 300 es
precision highp float;
out vec4 pixel;
uniform vec2 uResolution;
uniform vec2 uOrbit;
uniform float uAzimuth,uHeight;
uniform int uShape;
uniform bool uReflection,uShadow;
float cove(vec3 p){if(p.z< -2. && p.y<2.)return 2.-length(vec2(p.z+2.,p.y-2.));return min(p.y,p.z+4.);}
vec2 scene(vec3 p){
vec2 result=vec2(cove(p),0.);
vec2 cylinder=vec2(length(p.xz)-.97,abs(p.y-.31)-.29);
float pedestal=min(max(cylinder.x,cylinder.y),0.)+length(max(cylinder,0.))-.045;
if(pedestal<result.x)result=vec2(pedestal,1.);
vec3 q=p-vec3(0.,1.55,0.);float hero;
if(uShape==0)hero=length(vec2(length(q.xy)-.63,q.z))-.23;
else if(uShape==1)hero=length(q)-.83;
else {q.y-=clamp(q.y,-.36,.36);hero=length(q)-.5;}
if(hero<result.x)result=vec2(hero,2.);
return result;}
vec3 normalAt(vec3 p){vec2 e=vec2(.001,0.);return normalize(vec3(scene(p+e.xyy).x-scene(p-e.xyy).x,scene(p+e.yxy).x-scene(p-e.yxy).x,scene(p+e.yyx).x-scene(p-e.yyx).x));}
vec2 march(vec3 ro,vec3 rd,int steps){float t=0.;float material=-1.;for(int i=0;i<112;i++){if(i>=steps)break;vec2 h=scene(ro+rd*t);if(h.x<.0015){material=h.y;break;}t+=h.x*.85;if(t>24.)break;}return vec2(t,material);}
float softShadow(vec3 p,vec3 l,float distanceToLight){if(!uShadow)return 1.;float visibility=1.;float t=.025;for(int i=0;i<40;i++){float h=scene(p+l*t).x;if(h<.001)return .12;visibility=min(visibility,9.*h/t);t+=clamp(h,.025,.4);if(t>distanceToLight)break;}return clamp(visibility,.12,1.);}
vec3 shade(vec3 p,vec3 rd,float material){vec3 n=normalAt(p);vec3 lightPos=vec3(sin(uAzimuth)*4.,uHeight,cos(uAzimuth)*4.);vec3 delta=lightPos-p;vec3 l=normalize(delta);float shadow=softShadow(p+n*.008,l,length(delta));vec3 base=material>1.5?vec3(.32,.43,.16):(material>.5?vec3(.66,.65,.56):vec3(.63,.60,.53));float ambient=.23+.12*max(n.y,0.);float key=max(dot(n,l),0.)*shadow*1.15;float fill=.17*max(dot(n,normalize(vec3(3.,2.,-2.))),0.);vec3 color=base*(ambient+key+fill);vec3 halfVector=normalize(l-rd);float spec=pow(max(dot(n,halfVector),0.),material>1.5?65.:100.);color+=vec3(1.,.93,.8)*spec*shadow*(material>1.5?.55:.1);return color;}
void main(){vec2 uv=(gl_FragCoord.xy-.5*uResolution)/uResolution.y;
bool portrait=uResolution.x/uResolution.y<.85;
if(!portrait)uv.x+=.19;else uv.y-=.22;
vec3 target=vec3(0.,1.05,0.);float radius=portrait?7.8:6.5;
vec3 ro=target+radius*vec3(sin(uOrbit.x)*cos(uOrbit.y),sin(uOrbit.y),cos(uOrbit.x)*cos(uOrbit.y));
vec3 forward=normalize(target-ro),right=normalize(cross(forward,vec3(0.,1.,0.))),up=cross(right,forward);
vec3 rd=normalize(forward*1.7+right*uv.x+up*uv.y);vec2 hit=march(ro,rd,112);vec3 color=vec3(.63,.60,.53);
if(hit.y>=0.){vec3 p=ro+rd*hit.x;color=shade(p,rd,hit.y);
if(uReflection && hit.y<.5 && p.y<.08){vec3 n=normalAt(p);vec3 reflected=reflect(rd,n);vec2 rh=march(p+n*.012,reflected,72);vec3 reflectedColor=vec3(.48,.46,.40);if(rh.y>=0.)reflectedColor=shade(p+n*.012+reflected*rh.x,reflected,rh.y);float fresnel=.14+.35*pow(1.-max(dot(-rd,n),0.),5.);color=mix(color,reflectedColor,fresnel);}}
color=color/(color+vec3(.65));color=pow(color,vec3(1./2.2));pixel=vec4(color,1.);}`;
function compile(type,source){const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))fail('Shader compilation failed: '+gl.getShaderInfoLog(shader));return shader}
const program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,vertex));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))fail('Shader linking failed: '+gl.getProgramInfoLog(program));gl.useProgram(program);gl.bindVertexArray(gl.createVertexArray());
const uniforms={};for(const key of ['uResolution','uOrbit','uAzimuth','uHeight','uShape','uReflection','uShadow'])uniforms[key]=gl.getUniformLocation(program,key);
let shapeIndex=0,azimuth=-45,height=4.5,orbitX=.12,orbitY=.23;
const reflection=document.getElementById('toggle-reflections'),shadows=document.getElementById('toggle-shadows');
function render(){const scale=Math.min(window.devicePixelRatio||1,1.5,1500/window.innerWidth);const w=Math.round(innerWidth*scale),h=Math.round(innerHeight*scale);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}gl.uniform2f(uniforms.uResolution,w,h);gl.uniform2f(uniforms.uOrbit,orbitX,orbitY);gl.uniform1f(uniforms.uAzimuth,azimuth*Math.PI/180);gl.uniform1f(uniforms.uHeight,height);gl.uniform1i(uniforms.uShape,shapeIndex);gl.uniform1i(uniforms.uReflection,reflection.checked?1:0);gl.uniform1i(uniforms.uShadow,shadows.checked?1:0);gl.drawArrays(gl.TRIANGLES,0,3)}
document.getElementById('light-azimuth').addEventListener('input',e=>{azimuth=Number(e.target.value);document.getElementById('azimuth-value').textContent=azimuth+'°';render()});
document.getElementById('light-height').addEventListener('input',e=>{height=Number(e.target.value);document.getElementById('height-value').textContent=height.toFixed(1);render()});
document.getElementById('cycle-shape').addEventListener('click',()=>{shapeIndex=(shapeIndex+1)%3;document.getElementById('cycle-shape').innerHTML=['Torus','Sphere','Capsule'][shapeIndex]+' <span>↗</span>';document.getElementById('shape-count').textContent='0'+(shapeIndex+1)+' / 03';render()});
for(const input of [reflection,shadows])input.addEventListener('change',render);
let pointer=null;
canvas.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!pointer)return;orbitX=Math.max(-1.2,Math.min(1.2,orbitX-(e.clientX-pointer.x)*.006));orbitY=Math.max(.08,Math.min(.8,orbitY+(e.clientY-pointer.y)*.005));pointer={x:e.clientX,y:e.clientY};render()});
for(const kind of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(kind,()=>{pointer=null});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();errorBox.textContent='The graphics context was lost. Reload the page to restart the studio.';errorBox.hidden=false});
window.addEventListener('resize',render);render();
})();
</script>
</body></html>
